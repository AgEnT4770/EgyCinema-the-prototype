# --- AWS RDS MS SQL SERVER ---

# Connection URL format: jdbc:sqlserver://[endpoint]:[port];databaseName=[name];encrypt=true;trustServerCertificate=true
spring.datasource.url=jdbc:sqlserver://cinema-db.cqv8o0gkkhu0.us-east-1.rds.amazonaws.com:1433;databaseName=EgyCinema;encrypt=true;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=ahmed01093908250
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Hibernate Dialect for SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
# 'validate' strictly checks the DB against your Java code without changing anything.
# If they don't match, the app will throw an error telling you exactly what's wrong.
spring.jpa.hibernate.ddl-auto=validate

# This ensures Hibernate doesn't try to change "Cinemas" to "cinemas"
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Ensure DataSeeder runs
spring.sql.init.mode=always
