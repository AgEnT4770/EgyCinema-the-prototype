<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — EgyCinema</title>
<link rel="stylesheet" href="css/styles.css">
<style>
    .pay-grid { display: grid; grid-template-columns: 1fr 350px; gap: 40px; }
    .pay-card { background: #111; padding: 30px; border-radius: 16px; border: 1px solid #222; }
    .methods { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; margin-top: 20px; }
    .method { padding: 12px 16px; background: #222; border: 1px solid #333; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; flex: 1 1 calc(33.333% - 10px); color: white; transition: 0.2s; }
    .method:hover { border-color: var(--gold); }
    .method.active { background: rgba(255, 215, 0, 0.1); border-color: var(--gold); color: var(--gold); }
    .pane { display: none; }
    .pane.active { display: block; animation: fadeIn 0.3s ease; }
    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 8px; font-size: 13px; color: gray; }
    .field input { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; font-family: inherit; }
    .field input:focus { outline: none; border-color: var(--gold); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .secure-note { margin-top: 30px; padding-top: 20px; border-top: 1px solid #222; color: gray; font-size: 12px; text-align: center; }
    .wallet-info { background: #222; padding: 20px; border-radius: 8px; border-left: 4px solid var(--gold); font-size: 14px; line-height: 1.5; }
    .wallet-info strong { display: block; margin-bottom: 5px; color: white; }
    @media (max-width: 768px) { .pay-grid { grid-template-columns: 1fr; } .method { flex: 1 1 100%; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="header-slot"></div>
<main id="root"></main>
<div id="footer-slot"></div>

<script src="js/common.js"></script>
<script>
  mountChrome();

  // Retrieve data from URL correctly
  const p = new URLSearchParams(location.search);
  
  const movieData = {
    title: p.get('movie'),
    poster: p.get('poster') || "img/default-poster.jpg",
    genre: p.get('genre') || "Cinema Release",
    duration: p.get('duration') || "120 mins"
  };

  const cinemaName = p.get('cinema') || "EgyCinema Branch";
  const date = p.get('date') || "Today";
  const time = p.get('time') || "00:00";
  
  // FIX: booking sends only number of seats, not array
  const seatsCount = parseInt(p.get('seats') || '0', 10);
  
  const total = parseInt(p.get('total') || '0', 10);
  const bookingId = p.get('bookingId') || "N/A";

  const root = document.getElementById('root');

  // FIX: removed seats.length check (was causing crash/expiration)
  if(!movieData.title){
    root.innerHTML = `
      <div class="container" style="padding:100px 0; text-align:center;">
        <h1 class="font-display" style="font-size:32px; color:white; margin-bottom:16px">Payment session expired</h1>
        <p style="color:gray">Your seat reservation session has ended or is invalid.</p>
        <a href="home.html" class="btn btn-outline" style="margin-top:30px; display:inline-block; border-color:var(--gold); color:var(--gold);">Back to home</a>
      </div>`;
  } else {
    root.innerHTML = `
      <div class="container" style="padding-top:40px; padding-bottom:80px">
        <a href="javascript:history.back()" class="back-link" style="display:inline-flex; align-items:center; gap:8px; margin-bottom:30px; color:var(--gold); text-decoration:none">
          ${ICONS.back} <span>Back to seat selection</span>
        </a>

        <div style="margin-bottom:40px">
          <div class="uppercase-spaced" style="color:var(--gold); letter-spacing:2px; font-size:12px">Booking ID: #${bookingId}</div>
          <h1 class="font-display" style="font-size:clamp(32px, 4vw, 48px); font-weight:900; margin:10px 0">Checkout</h1>
          <p style="color:gray; margin:0">Choose how you'd like to pay for your tickets.</p>
        </div>

        <div class="pay-grid">
          <div class="pay-card">
            <h2 style="font-size: 20px; margin-top:0;">Payment Method</h2>
            <div class="methods" id="methods">
              <div class="method active" data-method="card"><span class="ic">💳</span><span>Credit / Debit</span></div>
              <div class="method" data-method="vodafone"><span class="ic">📱</span><span>Vodafone Cash</span></div>
              <div class="method" data-method="instapay"><span class="ic">⚡</span><span>InstaPay</span></div>
              <div class="method" data-method="fawry"><span class="ic">🏪</span><span>Fawry</span></div>
              <div class="method" data-method="cash"><span class="ic">💵</span><span>Pay at Box Office</span></div>
            </div>

            <!-- Card Pane -->
            <div class="pane active" data-pane="card">
              <div class="field">
                <label>Cardholder name</label>
                <input type="text" placeholder="Name as it appears on card" id="ccName">
              </div>
              <div class="field">
                <label>Card number</label>
                <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" id="ccNum">
              </div>
              <div class="row2">
                <div class="field">
                  <label>Expiry Date</label>
                  <input type="text" placeholder="MM/YY" maxlength="5" id="ccExp">
                </div>
                <div class="field">
                  <label>CVV / CVC</label>
                  <input type="text" placeholder="123" maxlength="4" id="ccCvv">
                </div>
              </div>
            </div>

            <!-- Vodafone Cash -->
            <div class="pane" data-pane="vodafone">
              <div class="field">
                <label>Vodafone Cash Mobile Number</label>
                <input type="tel" placeholder="010xxxxxxxx" maxlength="11" id="vodaNum">
              </div>
              <div class="wallet-info"><strong>You will receive a prompt on your phone.</strong> Enter your PIN to approve the payment securely.</div>
            </div>

            <!-- InstaPay -->
            <div class="pane" data-pane="instapay">
              <div class="field">
                <label>InstaPay Payment Address (IPA)</label>
                <input type="text" placeholder="username@instapay" id="instaAddress">
              </div>
              <div class="wallet-info"><strong>Open your InstaPay app.</strong> You will find a pending request to confirm the transaction.</div>
            </div>

            <!-- Fawry & Cash -->
            <div class="pane" data-pane="fawry">
              <div class="wallet-info" style="border-left-color: #F8CA1C;"><strong>Fawry Reference Code</strong> A reference code will be generated upon confirmation. Pay at any Fawry kiosk within 2 hours.</div>
            </div>
            
            <div class="pane" data-pane="cash">
              <div class="wallet-info" style="border-left-color: #4CAF50;"><strong>Pay at the Cinema Box Office</strong> Your seats will be reserved. Please arrive 30 minutes early to complete your payment.</div>
            </div>

            <div class="secure-note">🔒 All payments are encrypted and processed securely.</div>
          </div>

          <aside class="pay-card" style="align-self: start;">
            <div style="display:flex; gap:15px; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #222">
              <img src="${movieData.poster}" style="width:80px; height:120px; object-fit:cover; border-radius:8px">
              <div>
                <h4 style="margin:0 0 5px 0; font-size:18px;">${movieData.title}</h4>
                <p style="font-size:13px; color:gray; margin:0">${movieData.genre}</p>
                <p style="font-size:13px; color:var(--gold); margin:5px 0 0 0">${movieData.duration}</p>
              </div>
            </div>
            <div class="summary-mini">
              <div class="row" style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px;">
                <span style="color:gray;">Cinema</span><span>${cinemaName}</span>
              </div>
              <div class="row" style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px;">
                <span style="color:gray;">Date</span><span>${date}</span>
              </div>
              <div class="row" style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px;">
                <span style="color:gray;">Time</span><span>${time}</span>
              </div>
              <div class="row" style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px;">
                <span style="color:gray;">Seats</span>
                <span style="color:var(--gold)">${seatsCount} seat(s)</span> <!-- UPDATED LINE -->
              </div>
              <div class="row" style="display:flex; justify-content:space-between; margin-bottom:20px; padding-top:15px; border-top:1px solid #222; font-weight:bold; font-size:20px">
                <span>Total</span><span style="color:var(--gold)">${total} EGP</span>
              </div>
            </div>
            <button class="btn btn-hero btn-block" id="payBtn" style="width:100%; padding:15px; background:var(--gold); border:none; color:black; font-weight:bold; border-radius:8px; cursor:pointer; font-size:16px;">
              Complete Payment
            </button>
          </aside>
        </div>
      </div>`;

    const methodsEl = document.getElementById('methods');
    methodsEl.addEventListener('click', e => {
      const m = e.target.closest('[data-method]');
      if(!m) return;
      methodsEl.querySelectorAll('.method').forEach(x => x.classList.remove('active'));
      m.classList.add('active');
      const key = m.dataset.method;
      document.querySelectorAll('[data-pane]').forEach(p => {
        p.classList.toggle('active', p.dataset.pane === key);
      });
    });

    document.getElementById('payBtn').addEventListener('click', () => {
    const activeMethod = methodsEl.querySelector('.method.active').dataset.method;
      
      // Card Validation
      if(activeMethod === 'card'){
        const num = (document.getElementById('ccNum').value || '').replace(/\s/g,'');
        const name = document.getElementById('ccName').value.trim();
        const exp = document.getElementById('ccExp').value.trim();
        const cvv = document.getElementById('ccCvv').value.trim();
        
        if(!name || num.length < 16 || exp.length < 5 || cvv.length < 3){
          alert('Please fill in all card details correctly.');
          return;
        }
      }

      // Vodafone Validation
      if(activeMethod === 'vodafone'){
        const vodaNum = document.getElementById('vodaNum').value.trim();
        if(!vodaNum || vodaNum.length < 11 || !vodaNum.startsWith('01')){
          alert('Please enter a valid Vodafone Cash number.');
          return;
        }
      }

      // InstaPay Validation
      if(activeMethod === 'instapay'){
        const instaAddr = document.getElementById('instaAddress').value.trim();
        if(!instaAddr || instaAddr.length < 3){
          alert('Please enter your InstaPay address.');
          return;
        }
      }

      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.textContent = 'Processing Payment...';
      
      setTimeout(() => {
        alert(`Payment successful! Your tickets for ${movieData.title} are confirmed.`);
        location.href = 'home.html';
      }, 1500);
    });
  }
</script>
</body>
</html>
