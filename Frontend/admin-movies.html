<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Catalog | CinemaAdmin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* CUSTOM SCROLLBAR & SMOOTHING */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        html { scroll-behavior: smooth; }

        /* --- ADDED SCROLL LOGIC --- */
        .admin-main {
            height: 100vh;
            overflow-y: auto;
        }
        /* -------------------------- */

        /* MOVIE CARD HOVER EFFECTS */
        .movie-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-color: var(--gold) !important;
        }

        .poster-container {
            background: #000; 
            height: 320px; 
            border-radius: 0.5rem; 
            margin-bottom: 1rem; 
            overflow: hidden; 
            border: 1px solid var(--border);
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--gold);
            color: var(--gold);
        }

        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: none; 
            z-index: 100;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            background: var(--gold);
            color: black;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>

    </head>
<body class="cinema-bg">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </div>
                <div class="brand-name">Cinema<span class="text-gold">Admin</span></div>
            </div>
            <nav class="nav-menu">
                <a href="admin-dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="admin-cinemas.html" class="nav-item">🏢 Cinemas</a>
                <a href="admin-movies.html" class="nav-item active">🎬 Movies</a>
                <a href="admin-employees.html" class="nav-item">👥 Employees</a>
                <a href="admin-bookings.html" class="nav-item">🎟️ Bookings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2 class="text-gradient-gold">Movie Catalog</h2>
                </header>
            
            <div class="admin-content">
                <div id="movie-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2rem;">
                    <p style="color: var(--gold); text-align: center; grid-column: 1/-1;">Loading movies...</p>
                </div>
            </div>
        </main>
    </div>

    <button id="backToTop">↑</button>

    <script src="js/common.js"></script>
    <script>
        const API_URL = 'http://localhost:8083/movies';

        async function fetchMovies() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                
                const movies = await response.json();
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = '';

                if (movies.length === 0) {
                    grid.innerHTML = '<p style="color: var(--gold); text-align: center; grid-column: 1/-1;">No movies found in database.</p>';
                    return;
                }

                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'admin-panel movie-card';
                    card.style.padding = '1rem';
                    card.style.textAlign = 'center';
                    
                    // Match the case of MovieID based on your Java Entity
                    const mId = movie.movieId || movie.MovieID || movie.id;

                    card.innerHTML = `
                        <div class="poster-container">
                            <span class="status-badge">${movie.status || 'N/A'}</span>
                            <img src="${movie.imgUrl || 'img/default-poster.jpg'}" alt="${movie.title}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <h4 style="margin-bottom: 0.5rem; font-size: 1.1rem; height: 2.4rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                            ${movie.title}
                        </h4>
                        <p class="text-muted" style="font-size: 0.8rem; margin-bottom: 1rem;">${movie.duration} mins | ${movie.releaseDate || 'TBA'}</p>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-outline btn-sm" style="flex: 1; color: var(--primary); border-color: var(--primary);" onclick="deleteMovie(${mId})">
                                Delete Permanently
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                toast("Error loading movie catalog", "error");
            }
        }

        async function deleteMovie(id) {
            if (!confirm("⚠️ DANGER: This will delete the movie and all associated data. Continue?")) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    toast("Movie deleted successfully");
                    fetchMovies(); // Refresh list
                } else {
                    toast("Failed to delete movie", "error");
                }
            } catch (err) {
                toast("Server communication error", "error");
            }
        }

        // Back to top logic
        const topBtn = document.getElementById("backToTop");
        const mainContent = document.querySelector('.admin-main');

        // Since we moved scroll to .admin-main, we listen there
        mainContent.onscroll = () => {
            topBtn.style.display = (mainContent.scrollTop > 400) ? "block" : "none";
        };

        topBtn.onclick = () => mainContent.scrollTo({ top: 0, behavior: 'smooth' });

        document.addEventListener('DOMContentLoaded', fetchMovies);
    </script>
</body>
</html>
