<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard | EgyCinema</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- ADMIN-STYLE SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: var(--gold, #c5a059); border-radius: 10px; }
        
        /* --- LAYOUT & SCROLLING --- */
        .admin-content {
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding-right: 10px;
        }

        .table-scroll-container {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            position: relative;
        }

        .admin-table thead th {
            position: sticky;
            top: 0;
            background: #111;
            z-index: 10;
            border-bottom: 2px solid var(--gold);
            padding: 1rem;
            text-align: left;
            color: var(--gold);
        }

        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>
<body class="cinema-bg">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </div>
                <div class="brand-name">Cinema<span class="text-gold">Staff</span></div>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="overview">📊 Overview</a>
                <a href="#" class="nav-item" data-tab="movies">🎬 Movies</a>
                <a href="#" class="nav-item" data-tab="showtimes">🕒 Showtimes</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h2 class="text-gradient-gold">Management Console</h2>
                    <span class="pill pill-cinema" id="cinemaPill">🏢 Cinema: —</span>
                </div>
                <button class="btn btn-outline" onclick="handleLogout()">Log Out</button>
            </header>

            <div class="admin-content">
                <section class="tab-panel active" data-panel="overview">
                    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1.5rem;">
                        <div class="admin-panel"><div class="stat-n" id="movieCount">0</div><div class="stat-l">Movies Loaded</div></div>
                        <div class="admin-panel"><div class="stat-n" id="showCount">0</div><div class="stat-l">Total Showtimes</div></div>
                    </div>
                </section>

                <section class="tab-panel" data-panel="movies">
                    <div class="admin-panel">
                        <h3>Add New Movie</h3>
                        <form id="movieForm" onsubmit="addMovie(event)">
                            <div class="form-grid">
                                <label>Title<input name="title" required></label>
                                <label>Duration (min)<input name="duration" type="number" required></label>
                                <!-- FIXED: Name attribute matched to payload -->
                                <label>Release Date<input name="releaseDate" type="date" required></label>
                                <label>Poster URL<input name="imgUrl" type="url"></label>
                                <label>Trailer URL<input name="trailerUrl" type="url"></label>
                                <label>Category ID<input name="categoryId" type="number" value="1"></label>
                                <label class="full-width">Status<input name="status" placeholder="Now Showing"></label>
                            </div>
                            <button type="submit" class="btn btn-hero">Save Movie</button>
                        </form>
                    </div>

                    <div class="admin-panel">
                        <h3>Movie List</h3>
                        <div class="table-scroll-container">
                            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Title</th>
                                        <th>Release</th>
                                        <th style="text-align:right;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="moviesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="tab-panel" data-panel="showtimes">
                    <div class="admin-panel">
                        <h3>Schedule Show</h3>
                        <form id="showtimeForm" onsubmit="addShowtime(event)">
                            <div class="form-grid">
                                <!-- FIXED: select name changed to movieid to match entity -->
                                <label>Movie<select name="movieid" id="showMovieSel" required></select></label>
                                <label>Date<input name="date" type="date" required></label>
                                <label>Time<input name="time" type="time" required></label>
                                <label>Hall ID<input name="hallId" type="number" value="1" required></label>
                                <label>Price<input name="price" type="number" step="0.1" value="100" required></label>
                                <input type="hidden" name="cinemaId" value="1">
                            </div>
                            <button type="submit" class="btn btn-hero">Add Showtime</button>
                        </form>
                    </div>

                    <div class="admin-panel">
                        <h3>Current Schedule</h3>
                        <div class="table-scroll-container">
                            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr>
                                        <th>Show ID</th>
                                        <th>Movie ID</th>
                                        <th>Date/Time</th>
                                        <th>Hall</th>
                                        <th style="text-align:right;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="showtimesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = "http://localhost:8083";

        function getAuthHeader() {
            const token = sessionStorage.getItem('token');
            return { 
                'Authorization': `Bearer ${token}`, 
                'Content-Type': 'application/json' 
            };
        }

        async function fetchMovies() {
            try {
                const res = await fetch(`${API_BASE}/movies`);
                const movies = await res.json();
                renderMovies(movies);
                document.getElementById('movieCount').textContent = movies.length;
            } catch (err) { console.error("Movie fetch failed", err); }
        }

        async function fetchShows() {
            try {
                const res = await fetch(`${API_BASE}/showtimes`);
                const shows = await res.json();
                renderShows(shows);
                document.getElementById('showCount').textContent = shows.length;
            } catch (err) { console.error("Showtime fetch failed", err); }
        }

        function renderMovies(movies) {
            const tbody = document.getElementById('moviesBody');
            const sel = document.getElementById('showMovieSel');
            
            tbody.innerHTML = movies.map(m => {
                const mid = m.movieId || m.movieID || m.MovieID || m.id;
                // FIXED: Checking multiple naming conventions for release date
                const release = m.releaseDate || m.ReleaseDate || m.release_date || '—';
                
                return `
                    <tr>
                        <td style="color:var(--gold); font-weight:bold;">${mid}</td>
                        <td style="font-weight:600;">${m.title}</td>
                        <td>${release}</td>
                        <td style="text-align:right;">
                            <button class="btn btn-outline btn-sm" onclick="deleteMovie(${mid})" style="color:var(--primary);">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');

            sel.innerHTML = movies.map(m => {
                const mid = m.movieId || m.movieID || m.MovieID || m.id;
                return `<option value="${mid}">${m.title} (ID: ${mid})</option>`;
            }).join('');
        }

        function renderShows(shows) {
            const tbody = document.getElementById('showtimesBody');
            tbody.innerHTML = shows.map(s => {
                // FIXED: Fallback logic for movieid display
                const mReferenceId = s.movieid || s.movieId || s.movieID || 'N/A';
                return `
                <tr>
                    <td style="color:var(--gold);">#${s.id}</td>
                    <td>Movie ID: ${mReferenceId}</td>
                    <td>${s.date} @ ${s.time}</td>
                    <td>Hall ${s.hallId}</td>
                    <td style="text-align:right;">
                        <button class="btn btn-outline btn-sm" style="color:var(--primary);" onclick="deleteShow(${s.id})">Remove</button>
                    </td>
                </tr>
            `}).join('');
        }

        async function addMovie(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());
            
            const res = await fetch(`${API_BASE}/movies`, {
                method: 'POST',
                headers: getAuthHeader(),
                body: JSON.stringify(payload)
            });
            if (res.ok) { 
                e.target.reset(); 
                fetchMovies(); 
            }
        }

        async function addShowtime(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // FIXED: Ensuring movieid is extracted correctly from form and sent as integer
            const payload = {
                movieid: parseInt(data.movieid), 
                cinemaId: parseInt(data.cinemaId),
                hallId: parseInt(data.hallId),
                price: parseFloat(data.price),
                date: data.date,
                time: `${data.time}:00`,
                dateTime: `${data.date}T${data.time}:00`
            };

            const res = await fetch(`${API_BASE}/showtimes`, {
                method: 'POST',
                headers: getAuthHeader(),
                body: JSON.stringify(payload)
            });
            if (res.ok) { 
                e.target.reset(); 
                fetchShows(); 
            } else {
                alert("Failed to add showtime. Check console.");
            }
        }

        async function deleteMovie(id) {
            if(!id || !confirm(`⚠️ Delete movie #${id}?`)) return;
            const res = await fetch(`${API_BASE}/movies/${id}`, { 
                method: 'DELETE',
                headers: getAuthHeader()
            });
            if (res.ok) fetchMovies();
        }

        async function deleteShow(id) {
            if(!confirm("Remove this showtime?")) return;
            const res = await fetch(`${API_BASE}/showtimes/${id}`, { 
                method: 'DELETE',
                headers: getAuthHeader()
            });
            if (res.ok) fetchShows();
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-item, .tab-panel').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
            });
        });

        fetchMovies();
        fetchShows();

        function handleLogout() {
            sessionStorage.clear();
            location.href = 'index.html';
        }
    </script>
</body>
</html>
