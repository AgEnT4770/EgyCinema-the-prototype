<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Cinemas | CinemaAdmin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* 1. CUSTOM CINEMA SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a02c; }
        html { scroll-behavior: smooth; }

        /* 2. STICKY HEADER & SCROLLABLE PANEL */
        .admin-panel {
            max-height: 75vh;
            overflow-y: auto;
            position: relative;
        }
        .admin-table thead th {
            position: sticky;
            top: 0;
            background-color: #121212; /* Matches panel bg */
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 3. HOVER EFFECTS */
        .admin-table tbody tr {
            transition: background-color 0.3s ease;
        }
        .admin-table tbody tr:hover {
            background-color: rgba(212, 175, 55, 0.08);
        }
        .btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* 4. BACK TO TOP BUTTON */
        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: none; 
            z-index: 100;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            background: var(--gold);
            color: black;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>

    <!-- Security Guard -->
    <script>
        (function protectAdminPage() {
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.replace('staff-login.html');
                return;
            }
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.role !== 'ROLE_ADMIN') {
                    sessionStorage.setItem('toastMessage', 'Access Denied: Admins Only');
                    window.location.replace('employee-dashboard.html');
                }
            } catch (e) {
                sessionStorage.removeItem('token');
                window.location.replace('staff-login.html');
            }
        })();
    </script>
</head>

<body class="cinema-bg">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </div>
                <div class="brand-name">Cinema<span class="text-gold">Admin</span></div>
            </div>
            <nav class="nav-menu">
                <a href="admin-dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="admin-cinemas.html" class="nav-item active">🏢 Cinemas</a>
                <a href="admin-movies.html" class="nav-item">🎬 Movies</a>
                <a href="admin-employees.html" class="nav-item">👥 Employees</a>
                <a href="admin-bookings.html" class="nav-item">🎟️ Bookings</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2 class="text-gradient-gold">Cinema Locations</h2>
                <button class="btn btn-hero" onclick="addLocation()">Add New Location</button>
            </header>

            <div class="admin-content">
                <div class="admin-panel">
                    <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left; color: var(--gold);">
                                <th style="padding: 1rem;">Location Name</th>
                                <th style="padding: 1rem;">Halls</th>
                                <th style="padding: 1rem;">Address</th>
                                <th style="padding: 1rem; text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="cinema-list">
                            <tr><td colspan="4" style="text-align:center; padding:2rem;">Loading locations...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating UI Elements -->
    <button id="backToTop" title="Go to top">↑</button>

    <script src="js/common.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/api/Cinemas';

        /**
         * 1. FETCH & RENDER
         */
        async function fetchCinemas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const cinemas = await response.json();
                const list = document.getElementById('cinema-list');
                list.innerHTML = '';

                if (cinemas.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:2rem;">No locations found.</td></tr>';
                    return;
                }

                cinemas.forEach(cinema => {
                    const hallCount = cinema.totalHalls || 0; 
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid var(--border)';
                    row.innerHTML = `
                        <td style="padding: 1.5rem 1rem; font-weight: 600;">${cinema.name}</td>
                        <td style="padding: 1rem;">
                            <span class="badge" style="background: rgba(212, 175, 55, 0.15); color: var(--gold); padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(212, 175, 55, 0.3);">
                                ${hallCount} Halls
                            </span>
                        </td>
                        <td style="padding: 1rem;" class="text-muted">${cinema.location || 'N/A'}</td>
                        <td style="padding: 1rem; text-align: right;">
                            <button class="btn btn-outline btn-sm" onclick="editCinema(${cinema.id}, '${cinema.name}', '${cinema.location}')">Edit</button>
                            <button class="btn btn-outline btn-sm" style="color: var(--primary);" onclick="deleteCinema(${cinema.id})">Delete</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            } catch (err) {
                toast("Error loading cinemas", "error");
            }
        }

        /**
         * 2. ADD NEW LOCATION
         */
        async function addLocation() {
            const name = prompt("Enter Cinema Name:");
            const location = prompt("Enter Address:");
            if (!name || !location) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (response.ok) {
                    toast("Location added successfully!");
                    fetchCinemas();
                }
            } catch (err) { toast(err.message, "error"); }
        }

        /**
         * 3. EDIT LOCATION
         */
        async function editCinema(id, oldName, oldLoc) {
            const name = prompt("Update Cinema Name:", oldName);
            const location = prompt("Update Address:", oldLoc);
            if (!name || !location) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, location })
                });

                if (response.ok) {
                    toast("Location updated!");
                    fetchCinemas();
                }
            } catch (err) { toast(err.message, "error"); }
        }

        /**
         * 4. DELETE LOCATION
         */
        async function deleteCinema(id) {
            if (!confirm("⚠️ Are you sure? This will delete the cinema and all its halls permanently.")) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    toast("Location deleted");
                    fetchCinemas();
                }
            } catch (err) { toast(err.message, "error"); }
        }

        /**
         * 5. SCROLL CONTROLS
         */
        const topBtn = document.getElementById("backToTop");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                topBtn.style.display = "block";
            } else {
                topBtn.style.display = "none";
            }
        };
        topBtn.onclick = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.addEventListener('DOMContentLoaded', fetchCinemas);
    </script>
</body>
</html>
