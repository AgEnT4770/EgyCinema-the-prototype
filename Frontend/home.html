<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home — EgyCinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="header-slot"></div>
  
  <main style="flex:1">
    <section class="featured" id="featured">
      <div class="container" style="padding: 4rem 0; text-align: center;">
        <p style="color: var(--gold);">Loading latest premieres...</p>
      </div>
    </section>

    <section id="cinemas" class="cinemas-section">
      <div class="container">
        <div class="intro">
          <div class="eyebrow">Cinemas across Egypt</div>
          <h2>Pick your screen, pick your story</h2>
        </div>
        <div id="cinemaList">
          <!-- Loading State -->
          <p style="text-align: center; padding: 4rem; color: #888;">Connecting to Cinema Servers...</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <!-- Dependencies -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>

  <script>
    // --- Port Mapping ---
    const API_CINEMA = "http://100.49.29.15:8080";    // Cinema Service
    const API_MOVIES_SHOWS = "http://100.49.29.15:8083"; // Movie & Showtime Service

    mountChrome();

   /**
     * 1. Dynamic Hero Section (FIXED ID LOOKUP)
     */
    function renderFeatured(movie) {
        if (!movie) return;
        // Check for MovieID (from your JSON) or movieId (from your Java)
        const mid = movie.MovieID || movie.movieId || movie.id;
        
        document.getElementById('featured').innerHTML = `
          <img src="${movie.imgUrl || 'img/default-backdrop.jpg'}" alt="${movie.title}" />
          <div class="container">
            <div class="eyebrow">Now Premiering</div>
            <h1>${movie.title}</h1>
            <p>${movie.status || 'Experience the latest cinematic masterpiece on the big screen.'}</p>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
              <a class="btn btn-hero btn-lg" href="movie.html?id=${mid}"><span class="icon">${ICONS.play}</span> Watch details</a>
            </div>
          </div>`;
    }

    /**
     * 2. Cross-Service Data Mapping (FIXED MAPPING LOGIC)
     */
    async function loadPageData() {
        const listContainer = document.getElementById('cinemaList');
        
        try {
            const [resCinemas, resMovies, resShows] = await Promise.all([
                fetch(`${API_CINEMA}/api/Cinemas`),        
                fetch(`${API_MOVIES_SHOWS}/movies`),      
                fetch(`${API_MOVIES_SHOWS}/showtimes`)    
            ]);

            if (!resCinemas.ok || !resMovies.ok || !resShows.ok) throw new Error("Connection failed");

            const allCinemas = await resCinemas.json();
            const allMovies = await resMovies.json();
            const allShowtimes = await resShows.json();

            if (allMovies.length > 0) renderFeatured(allMovies[0]);

            if (allCinemas.length === 0) {
                listContainer.innerHTML = "<p style='text-align:center;'>No cinemas found.</p>";
                return;
            }

            listContainer.innerHTML = allCinemas.map(cinema => {
                const cid = cinema.id || cinema.cinemaId || cinema.CinemaID;
                
                // 1. Find showtimes for this cinema
                const cinemaShowtimes = allShowtimes.filter(s => s.cinemaId == cid);

                // 2. Get unique Movie IDs from those showtimes
                const movieIdsAtCinema = [...new Set(cinemaShowtimes.map(s => s.movieId))];

                // 3. Find the Movie object by checking all possible ID casings
                const moviesToShow = movieIdsAtCinema.map(mid => 
                    allMovies.find(m => (m.MovieID || m.movieId || m.id) == mid)
                ).filter(Boolean);

                return renderCinemaRow(cinema, moviesToShow, cinemaShowtimes);
            }).join('');

        } catch (error) {
            console.error("Backend connection failed:", error);
            listContainer.innerHTML = `<p style="text-align:center; padding: 3rem;">Synchronization Error. Check Console.</p>`;
        }
    }

    /**
     * 3. Cinema Row Generator
     */
    function renderCinemaRow(cinema, movies, showtimes) {
        const cid = cinema.id || cinema.cinemaId || cinema.CinemaID;
        const moviesHtml = movies.length > 0 
            ? movies.map(m => {
                const mid = m.MovieID || m.movieId || m.id;
                const movieShows = showtimes.filter(s => s.movieId == mid);
                return renderMovieCard(m, cid, movieShows);
            }).join('')
            : `<p style="grid-column: 1/-1; padding: 2rem; color: #444; text-align: center;">No screenings scheduled.</p>`;

        return `
          <div class="cinema-row">
            <div class="head">
              <div>
                <h2>${cinema.name}</h2>
                <div class="loc"><span class="icon">${ICONS.pin}</span>${cinema.location || 'Egypt'}</div>
              </div>
              <div class="divider"></div>
            </div>
            <div class="movie-grid">${moviesHtml}</div>
          </div>`;
    }

    /**
     * 4. Movie Card Generator (FIXED DATE AND ID)
     */
    function renderMovieCard(m, cinemaId, showtimes) {
        const mid = m.MovieID || m.movieId || m.id;
        const releaseDate = m.ReleaseDate || m.releaseDate; // Handle both casings
        
        const grouped = showtimes.reduce((acc, s) => {
            const d = s.date || "Today";
            if (!acc[d]) acc[d] = [];
            // Handle cases where time might be null
            if(s.time) acc[d].push(s.time.substring(0, 5));
            return acc;
        }, {});

        return `
          <div class="movie-card movie-card-grid">
            <a href="movie.html?id=${mid}" class="poster-link">
              <div class="poster">
                <span class="rating">${m.status || 'PG-13'}</span>
                <img src="${m.imgUrl || 'img/default-poster.jpg'}" alt="${m.title}" loading="lazy" />
              </div>
              <h3>${m.title}</h3>
              <div class="movie-meta">
                <span>${ICONS.clock} ${m.duration} min</span>
                <span>${releaseDate ? releaseDate.toString().substring(0,4) : '2026'}</span>
              </div>
            </a>
            <div class="showtimes">
              ${Object.keys(grouped).map(date => `
                <div class="show-day">
                  <div class="show-date"><span class="icon">${ICONS.cal}</span>${date}</div>
                  <div class="show-times">
                    ${grouped[date].map(t => `
                      <button type="button" class="time-chip">
                        ${t}
                      </button>`).join('')}
                  </div>
                </div>`).join('')}
            </div>
          </div>`;
    }
    // Start
    loadPageData();
  </script>
</body>
</html>
